# Serves the built static files and falls back to index.html for any path
# that isn't a real file — required for React Router's client-side routes
# (e.g. a direct visit to /venues/abc123, or a refresh on that URL) to work
# instead of 404ing at the web server before React ever loads.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default output naming) are safe to cache
    # forever; index.html itself must never be cached, or a deploy wouldn't
    # actually reach anyone until their cache expired.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
